<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <title>BitPilot</title>
    <!-- BitPilot mark: an 8-point compass star wraps a Bitcoin ₿ medallion.
         The compass points to "Bitcoin as a destination you can navigate to";
         the orange→gold gradient nods to canonical Bitcoin while the navy
         field reads as the premium fintech aesthetic in the brand guide.
         Reads at 16px because the central circle + ₿ stay dominant; the
         compass points become a halo at that size. -->
    <defs>
        <radialGradient id="bp-fav-bg" cx="50%" cy="38%" r="70%">
            <stop offset="0%" stop-color="#1A2845" />
            <stop offset="100%" stop-color="#0B1220" />
        </radialGradient>
        <linearGradient id="bp-fav-star" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFAB91" />
            <stop offset="55%" stop-color="#F7931A" />
            <stop offset="100%" stop-color="#E07A0A" />
        </linearGradient>
    </defs>
    <!-- Rounded navy square works in tabs, home-screen icons, and macOS docks. -->
    <rect width="64" height="64" rx="12" fill="url(#bp-fav-bg)" />
    <!-- Cardinal compass points (N/E/S/W): long, thin diamonds. -->
    <g transform="translate(32 32)" fill="url(#bp-fav-star)">
        <polygon points="0,-25 4.5,-7 0,-5 -4.5,-7" />
        <polygon points="25,0 7,4.5 5,0 7,-4.5" />
        <polygon points="0,25 -4.5,7 0,5 4.5,7" />
        <polygon points="-25,0 -7,-4.5 -5,0 -7,4.5" />
    </g>
    <!-- Diagonal compass points (NE/SE/SW/NW): shorter, dimmer. -->
    <g transform="translate(32 32) rotate(45)" fill="url(#bp-fav-star)" opacity="0.55">
        <polygon points="0,-17 3,-5 0,-3 -3,-5" />
        <polygon points="17,0 5,3 3,0 5,-3" />
        <polygon points="0,17 -3,5 0,3 3,5" />
        <polygon points="-17,0 -5,-3 -3,0 -5,3" />
    </g>
    <!-- Central medallion: navy fill with an orange rim that catches the eye
         at small sizes. -->
    <circle cx="32" cy="32" r="14" fill="#0B1220" stroke="#F7931A" stroke-width="1.5" />
    <!-- Bitcoin ₿. Cream rather than pure white so it picks up the gold
         accent from the star points instead of looking sterile. -->
    <text x="32" y="40" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="900" font-size="20" fill="#FFCCBC">₿</text>
</svg>
