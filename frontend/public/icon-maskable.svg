<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <title>BitPilot</title>
    <!-- Maskable variant of the BitPilot mark. The OS may crop this to any
         shape (circle, squircle, rounded square) — the spec wants the
         critical content inside a centered 320×320 safe zone, leaving a
         96px guard band on every side. Background fills the full canvas so
         no corner ever shows through after the mask. -->
    <defs>
        <radialGradient id="bp-mask-bg" cx="50%" cy="38%" r="70%">
            <stop offset="0%" stop-color="#1A2845" />
            <stop offset="100%" stop-color="#0B1220" />
        </radialGradient>
        <linearGradient id="bp-mask-star" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD27A" />
            <stop offset="55%" stop-color="#F7931A" />
            <stop offset="100%" stop-color="#E07A0A" />
        </linearGradient>
    </defs>
    <!-- Full-canvas fill so the mask never reveals a transparent corner. -->
    <rect width="512" height="512" fill="url(#bp-mask-bg)" />
    <!-- Inner mark sized to fit inside the 320×320 safe zone, centered. The
         shapes below are the same as the favicon, scaled up ~4×. -->
    <g transform="translate(256 256)">
        <!-- Cardinal compass points. -->
        <g fill="url(#bp-mask-star)">
            <polygon points="0,-100 18,-28 0,-20 -18,-28" />
            <polygon points="100,0 28,18 20,0 28,-18" />
            <polygon points="0,100 -18,28 0,20 18,28" />
            <polygon points="-100,0 -28,-18 -20,0 -28,18" />
        </g>
        <!-- Diagonal compass points. -->
        <g transform="rotate(45)" fill="url(#bp-mask-star)" opacity="0.55">
            <polygon points="0,-68 12,-20 0,-12 -12,-20" />
            <polygon points="68,0 20,12 12,0 20,-12" />
            <polygon points="0,68 -12,20 0,12 12,20" />
            <polygon points="-68,0 -20,-12 -12,0 -20,12" />
        </g>
        <!-- Central medallion. -->
        <circle cx="0" cy="0" r="56" fill="#0B1220" stroke="#F7931A" stroke-width="6" />
        <!-- ₿ glyph. Cream tint matches the star gradient. -->
        <text x="0" y="32" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
            font-weight="900" font-size="80" fill="#FFE7C2">₿</text>
    </g>
</svg>
