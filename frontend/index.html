<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
    <meta name="description"
        content="Learn Bitcoin, Lightning, Nostr and eCash by actually using them. Ten short missions, real Nostr identity, no jargon." />
    <meta name="color-scheme" content="dark light" />
    <!-- Defense-in-depth CSP. The host's CSP (Vercel/Cloudflare) is the
         load-bearing layer; this is a backup so the page itself denies
         anything we haven't whitelisted. `connect-src` covers the API
         path under the same origin (we proxy /api/*); add explicit
         origins if you split the API onto a different domain. -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
            script-src 'self';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data:;
            font-src 'self' data:;
            connect-src 'self';
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'self';
            object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BitPilot — Learn Bitcoin, Lightning, Nostr and eCash by using them</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
