# fly.toml app configuration file generated for bitpilot on 2026-05-20T14:23:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bitpilot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  BODY_LIMIT_BYTES = '65536'
  DATABASE_URL = 'sqlite:///data/bitpilot.db?mode=rwc'
  PORT = '8080'
  RATE_LIMIT_BURST = '30'
  RATE_LIMIT_PER_SEC = '1'
  REQUEST_TIMEOUT_SECS = '25'
  RUST_LOG = 'bitpilot=info,tower_http=warn'

[[mounts]]
  source = 'bitpilot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
