# gitleaks config for bitpilot
# Extends the default ruleset shipped with gitleaks and adds project-specific
# allowlists so the pre-commit hook stays quiet on known false positives.
#
# Run manually:
#   gitleaks git --redact --verbose                      # scan git history
#   gitleaks dir --redact --verbose .                    # scan working tree
#   gitleaks git --staged --redact                       # what the hook runs

[extend]
useDefault = true

[allowlist]
description = "bitpilot allowlist"

# Directories that contain build output, vendored binaries, or other generated
# files where high-entropy strings are expected and cannot leak to git anyway
# (target/ and dist/ are in .gitignore).
paths = [
    '''(^|/)backend/target/''',
    '''(^|/)frontend/dist/''',
    '''(^|/)frontend/node_modules/''',
    '''(^|/)\.git/''',
    '''(^|/)Cargo\.lock$''',
    '''(^|/)package-lock\.json$''',
    # The example env file ships placeholder values only.
    '''(^|/)backend/\.env\.example$''',
]

# Regexes for known-safe placeholders that appear in docs and example files.
regexes = [
    '''replace[-_]?me''',
    '''your[-_]?(admin|api)[-_]?key[-_]?here''',
    '''xxxx+''',
]
